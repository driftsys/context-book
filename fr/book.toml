[book]
title = "Context Engineering"
authors = ["Sébastien Tasson"]
description = "Une référence sur le context engineering : histoire, figures clés, glossaire, outils et techniques SDD/TDD pour travailler avec des agents de code."
language = "fr"
src = "src"

[build]
build-dir = "../book/fr"

[output.html]
additional-js = ["lang-switch.js"]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/driftsys/context-book"
edit-url-template = "https://github.com/driftsys/context-book/edit/main/fr/src/{path}"
site-url = "/context-book/fr/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20
